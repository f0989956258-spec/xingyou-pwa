<meta name="background-color" content="#F4F1E7">

<meta name="apple-mobile-web-app-title" content="行遊">

<style>
:root{--bg:#F4F1E7;--card:#FFFEFA;--tx:#293A32;--sub:#6C7D70;--ac:#2F6F62;--ac2:#E8F0E7;--line:#D5DDCE;--warn:#B9563D;--sun:#E8A45B;--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18221D;--card:#222F28;--tx:#E8EFE5;--sub:#A0B2A3;--ac:#84B5A0;--ac2:#2D4035;--line:#3D5144;--warn:#F08A72;--sun:#E8A45B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18221D;--card:#222F28;--tx:#E8EFE5;--sub:#A0B2A3;--ac:#84B5A0;--ac2:#2D4035;--line:#3D5144;--warn:#F08A72;--sun:#E8A45B;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg)}
body{background:radial-gradient(ellipse at 50% -10%,rgba(232,164,91,.10),transparent 48%),var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;min-height:100dvh;max-width:520px;margin:0 auto;padding-left:var(--safe-left);padding-right:var(--safe-right)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 8px}
h1,h2{font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;margin:0}
h1{font-size:26px;font-weight:900;letter-spacing:.04em}
h2{font-size:19px}
main{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sub{color:var(--sub);margin:2px 0 14px}
label{display:block;font-weight:600;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.days .chip{flex:none}
.btn{width:100%;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:14px;border-radius:12px;margin-top:22px;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.mini{border:0;background:var(--ac2);color:var(--ac);border-radius:8px;width:32px;height:32px;font:inherit;cursor:pointer}
.mini.x{color:var(--warn)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;border-left:2px dashed var(--line)}
.stop{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.stop:before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.stop b{display:block}
.tm{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700;min-width:46px}
.stop .mid{flex:1}
.stop .meta{font-size:12.5px;color:var(--sub)}
.ops{display:flex;gap:4px}
.leg{margin:6px 0;color:var(--sub);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input{flex:1}
textarea{width:100%;min-height:110px}
.stay-card{padding:14px}
.stay-card .stay-heading{align-items:flex-start;margin-bottom:6px}
.stay-card .stay-heading h2{font-size:17px}
.stay-card .stay-heading .sub{margin:2px 0 0}
.stay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stay-field{display:block;margin:4px 0;font-size:13px}
.stay-field input,.stay-field textarea{display:block;width:100%;margin-top:4px}
.stay-field.full{grid-column:1/-1}
.stay-field textarea{min-height:72px}
.stay-map{display:inline-flex;margin-top:8px;text-decoration:none}
.stay-map[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.stay-location .meta{margin:3px 0 8px;overflow-wrap:anywhere}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:var(--safe-bottom)}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12.5px;padding:9px 0 8px;cursor:pointer;min-height:52px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:28px 0}
.sum{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:900}
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:0 6px;font-size:12px;margin-right:6px}
.install-app{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;background:var(--sun);color:#293A32;font:inherit;font-weight:800;padding:10px 14px;box-shadow:0 6px 18px rgba(41,58,50,.18);cursor:pointer}
.install-app[hidden]{display:none}
.update-app{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;transform:translateX(-50%);border:0;border-radius:999px;background:var(--ac);color:#fff;font:inherit;font-weight:800;padding:11px 16px;box-shadow:0 6px 18px rgba(41,58,50,.24);cursor:pointer;white-space:nowrap}
.update-app[hidden]{display:none}
.offline-note{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));z-index:21;transform:translateX(-50%);background:var(--tx);color:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.offline-note[hidden]{display:none}

/* 島嶼手札：紙感底色、手繪路徑與暖橘行程標記 */
h1{display:inline-flex;align-items:center;gap:8px}
h1::after{content:"";width:29px;height:9px;border-top:2px dashed var(--sun);border-right:2px dashed var(--sun);border-radius:0 12px 0 0;transform:translateY(3px);opacity:.9}
.chip,.btn,.ghost,.mini,nav button{transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,filter .18s ease}
.chip:hover,.ghost:hover,.mini:hover{border-color:var(--sun)}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(min-width:720px){body{padding:24px 0}#app{height:min(900px,calc(100vh - 48px));min-height:520px;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(41,58,50,.12);overflow:hidden}}
</style>
</head>

function plan(){const t=S.trip,a=t.days[S.day];let tm=540,h="",endAct=540;
 a.forEach((p,i)=>{let s=tm;const nt=isNight(p);if(nt&&s<1080){h+=`<div class="leg">🍽️ 用餐休息，18:00 後進入夜市活動</div>`;s=1080}tm=s+p.stay;const over=tm>1320&&p.type!=="stay";if(p.type!=="stay")endAct=tm;
  h+=`<div class="stop"><div class="tm" style="${over?"color:var(--warn)":""}">${hm(s)}</div><div class="mid"><b>${esc(p.name)}</b><div class="meta"><span class="tag">${TG[p.type]}</span>${REC.has(p.name)?'<span class="tag">⭐ 推薦</span>':""}${nt?'<span class="tag">🌙 夜間</span>':""}${over?'<span style="color:var(--warn)">⚠ 超過 22:00 </span>':""}${p.type==="stay"?"今晚住宿":"停留 "+p.stay+" 分"} <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+t.dest)}" target="_blank" rel="noopener" style="color:var(--ac)">📍地圖</a></div></div><div class="ops"><button class="mini" aria-label="上移" onclick="mv(${i},-1)">↑</button><button class="mini" aria-label="下移" onclick="mv(${i},1)">↓</button><button class="mini x" aria-label="移除" onclick="del(${i})">✕</button></div></div>`;
  if(i<a.length-1){const g=leg(p,a[i+1]);tm+=g.t;h+=`<div class="leg">${g.i} ${g.m}約 ${g.t} 分鐘（${g.d.toFixed(1)} 公里）</div>`}});
 const used=new Set(t.days.flat().map(p=>p.name)),last=a[a.length-1];
 let pool=D[t.dest].filter(x=>!used.has(x[0])).map(mk);if(last)pool.sort((x,y)=>dist(last,x)-dist(last,y));
 return `<main>${dayBar()}${accommodationCard(t,S.day)}
 ${a.length?`<div class="tl">${h}</div><p class="sub" style="margin-top:12px">預計 ${hm(540)} 出發，${hm(endAct)} 結束${endAct>1320?"，已超過 22:00 終止時間，建議刪減景點":"（22:00 前收工）"}</p>`:`<div class="empty">這天還沒有景點，從下方加入。</div>`}
 <label>附近景點${last?"（離最後一站由近到遠）":""}</label>
 <div class="chips">${pool.slice(0,6).map(p=>chip("＋ "+esc(p.name),false,`add('${p.name}')`)).join("")||'<span class="sub">景點都排進行程了</span>'}</div>
 <button class="btn" style="background:var(--ac2);color:var(--ac)" onclick="regen()">依偏好重新排程</button></main>`}

function gm(a){const q=p=>encodeURIComponent(p.name+" "+S.trip.dest);return "https://www.google.com/maps/dir/?api=1&origin="+q(a[0])+"&destination="+q(a[a.length-1])+(a.length>2?"&waypoints="+a.slice(1,-1).map(q).join("%7C"):"")+"&travelmode=transit"}
const IS_IOS_DEVICE=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const SHIELD_SHORTCUT_NAME="行遊導航＋神盾";
function shieldShortcutUrl(routeUrl){return `shortcuts://run-shortcut?name=${encodeURIComponent(SHIELD_SHORTCUT_NAME)}&input=text&text=${encodeURIComponent(routeUrl)}`}
function tw(){const t=S.trip,pts=OUT.map(x=>PJ(...x).map(v=>v.toFixed(1)).join(",")).join(" ");
 const dots=Object.keys(C).map(k=>{const[x,y]=PJ(C[k].lng,C[k].lat),on=k===t.dest,lb=on||k===S.from;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?7:3.5}" fill="${on?"var(--warn)":"var(--ac)"}" opacity="${on?1:.6}"/>`+(lb?`<text x="${(x+(C[k].lng>121.2?-11:11)).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${C[k].lng>121.2?"end":"start"}" font-size="12" font-weight="700" fill="var(--tx)">${k}</text>`:"")}).join("");
 return `<svg class="map" viewBox="0 0 340 390" style="max-height:340px;margin-bottom:10px" role="img" aria-label="台灣縣市位置示意圖"><polygon points="${pts}" fill="var(--ac2)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`}
const card=(i,t,a,b)=>`<div class="card row"><span style="font-size:26px">${i}</span><div><b>${t}</b><div>${a}</div><div class="sub meta">${b||""}</div></div></div>`;
function rail(){const t=S.trip,d=t.dest,f=S.from;let h="";
 if(f===d)h='<div class="empty">出發地與目的地相同，不需要城際交通。</div>';
 else if(ISL.includes(f)||ISL.includes(d))h='<div class="card">離島與本島之間需搭飛機或船，請向航空公司或船公司查詢班次。</div>';
 else{const km=dist(C[f],C[d]),r=km*1.2;
  if(HS[f]&&HS[d]){const a=HS[f],b=HS[d];h+=card("🚄","高鐵",`車程約 ${Math.abs(a[1]-b[1])} 分（直達車），標準車廂約 $${Math.round(Math.abs(a[0]-b[0])*4.55/5)*5}`,"含進出站與轉乘約再加 30 分鐘")}
  else h+=card("🚄","高鐵","此縣市沒有高鐵站","可搭台鐵或自駕")
  h+=card("🚆","台鐵自強號",`車程約 ${Math.round(r/95*60+10)} 分，票價約 $${Math.max(20,Math.round(km*2.8/5)*5)}`,"以縣市中心概估，實際依停靠站而定")+card("🚗","自駕",`約 ${Math.round(r*1.08/70*60)} 分鐘`,`直線距離約 ${km.toFixed(0)} 公里，另計過路費與停車`)}
 return `<main><h2 style="margin:6px 0 4px">前往${esc(d)}</h2><p class="sub">以下是依距離估算的車程與票價，不是即時時刻表。</p>
 <label style="margin-top:6px">出發縣市</label><select style="width:100%" onchange="S.from=this.value;render()">${Object.keys(D).map(k=>`<option ${k===f?"selected":""}>${k}</option>`).join("")}</select>
 <div style="margin-top:14px">${h}</div>
 <div class="row" style="margin-top:8px"><a class="ghost" style="text-decoration:none;color:var(--tx)" href="https://www.thsrc.com.tw" target="_blank" rel="noopener">高鐵官網</a><a class="ghost" style="text-decoration:none;color:var(--tx)" href="https://www.railway.gov.tw" target="_blank" rel="noopener">台鐵官網</a></div></main>`}
function mapv(){const a=S.trip.days[S.day],stayCard=accommodationLocationCard(S.trip,S.day);
 if(!a.length)return `<main>${tw()}${dayBar()}${stayCard}<div class="empty">這天沒有景點可顯示。</div></main>`;
 const la=a.map(p=>p.lat),lo=a.map(p=>p.lng),W=340,H=300,P=34,mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo);
 const pt=p=>[P+(mxO>mnO?(p.lng-mnO)/(mxO-mnO):.5)*(W-2*P),P+(mxA>mnA?(mxA-p.lat)/(mxA-mnA):.5)*(H-2*P)];
 const xy=a.map(pt);let tot=0,tt=0;const L=[];
 for(let i=0;i<a.length-1;i++){const g=leg(a[i],a[i+1]);tot+=g.d;tt+=g.t;L.push(g)}
 return `<main>${tw()}${dayBar()}${stayCard}
 <svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="當日路線圖">
 <polyline points="${xy.map(q=>q.join(",")).join(" ")}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-dasharray="6 5"/>
 ${xy.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="11" fill="var(--ac)"/><text x="${q[0]}" y="${q[1]+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${i+1}</text><text x="${q[0]}" y="${q[1]+(q[1]>H-50?-17:26)}" text-anchor="middle" font-size="11" fill="var(--tx)">${esc(a[i].name)}</text>`).join("")}
 </svg>
 ${IS_IOS_DEVICE?`<a class="btn" style="display:block;text-align:center;text-decoration:none;margin:12px 0" href="${esc(shieldShortcutUrl(gm(a)))}">🛡 導航＋啟動神盾</a><details class="card"><summary>首次使用：設定 iPhone 捷徑</summary><ol><li>在「捷徑」App 建立捷徑，名稱設為「${SHIELD_SHORTCUT_NAME}」。</li><li>讓捷徑使用收到的「捷徑輸入」作為網址，加入「開啟 URL」動作。</li><li>再加入「開啟 App」動作，選擇「神盾測速照相」。</li><li>回到這裡點「導航＋啟動神盾」；若 iOS 顯示確認，請依畫面允許。</li></ol><p class="sub">網站會把當日 Google Maps 路線傳入捷徑。捷徑或神盾未設定時，請使用下方 Google 地圖按鈕。</p></details>`:""}<a class="${IS_IOS_DEVICE?"ghost":"btn"}" style="display:block;text-align:center;text-decoration:none;margin:12px 0" href="${gm(a)}" target="_blank" rel="noopener">${IS_IOS_DEVICE?"只開啟 Google 地圖":"在 Google 地圖開啟當日路線"}</a><p class="sub" style="margin-top:10px">全日移動約 ${tot.toFixed(1)} 公里，交通 ${tt} 分鐘</p>
 ${L.map((g,i)=>`<div class="card row"><span style="font-size:22px">${g.i}</span><div>${esc(a[i].name)} → ${esc(a[i+1].name)}<div class="meta sub">${g.m}約 ${g.t} 分鐘</div></div></div>`).join("")}</main>`}

function budget(){const t=S.trip,n=t.members.length,tot=t.exp.reduce((s,e)=>s+e.amt,0),share=tot/n;
 const paid={};t.members.forEach(m=>paid[m.n]=0);t.exp.forEach(e=>{paid[e.who]=(paid[e.who]||0)+e.amt});
 const bal=Object.entries(paid).map(([k,v])=>[k,v-share]);
 return `<main><div class="card"><div class="sub">總支出</div><div class="sum">$${Math.round(tot).toLocaleString()}</div><div class="sub">${n} 人均分，每人 $${Math.round(share).toLocaleString()}</div></div>
 <div class="card"><div class="row"><input id="ei" placeholder="項目，例如晚餐"><input id="ea" type="number" inputmode="decimal" placeholder="金額" style="max-width:90px"></div>
 <div class="row" style="margin-top:8px"><select id="ew" style="flex:1" aria-label="付款人">${t.members.map(m=>`<option>${esc(m.n)}</option>`).join("")}</select><button class="ghost" onclick="addExp()">記一筆</button></div></div>
 ${t.exp.length?t.exp.map((e,i)=>`<div class="card row"><div style="flex:1">${esc(e.item)}<div class="sub meta">${esc(e.who)} 先付</div></div><b>$${e.amt.toLocaleString()}</b><button class="mini x" onclick="delExp(${i})" aria-label="刪除">✕</button></div>`).join(""):'<div class="empty">還沒有花費紀錄。</div>'}
 ${tot?`<h2 style="margin:18px 0 8px">分帳結果</h2>${bal.map(([k,v])=>`<div class="card row"><div style="flex:1">${esc(k)}</div><b style="color:${v<0?"var(--warn)":"var(--ac)"}">${v<0?"需付出 $"+Math.round(-v):"可收回 $"+Math.round(v)}</b></div>`).join("")}`:""}</main>`}

function team(){const t=S.trip;
 return `<main><h2 style="margin:6px 0 10px">旅伴</h2>
 ${t.members.map((m,i)=>`<div class="card row"><div style="flex:1">${esc(m.n)}${i===0?' <span class="sub">（擁有者）</span>':""}</div><button class="ghost" onclick="role(${i})">${m.r}</button></div>`).join("")}
 <div class="row"><input id="mn" placeholder="輸入旅伴名稱"><button class="ghost" onclick="addMember()">邀請</button></div>
 <h2 style="margin:20px 0 8px">共享筆記</h2><textarea oninput="notes(this.value)" placeholder="入住資訊、必吃清單、注意事項">${esc(t.notes)}</textarea>
 <h2 style="margin:20px 0 8px">編輯紀錄</h2>${t.log.slice(0,8).map(l=>`<div class="leg">• ${esc(l)}</div>`).join("")}</main>`}

function render(){const A=document.getElementById("app");
 if(!S.trip){A.innerHTML=create();window.XingyouCloud?.mount();return}
 S.trip=normalizeTrip(S.trip)||null;if(!S.trip){A.innerHTML=create();return}S.day=Math.max(0,Math.min(S.day,S.trip.days.length-1));
 const t=S.trip,view={plan,map:mapv,rail,budget,team}[S.tab]||plan,V=view(),T=[["plan","🗓️","行程"],["map","🗺️","地圖"],["rail","🚄","交通"],["budget","💰","預算"],["team","👥","協作"]];
 A.innerHTML=`<header><div><h2>${esc(t.dest)} ${t.days.length} 日遊</h2></div><button class="ghost" onclick="reset()">新行程</button></header>${V}<nav>${T.map(x=>`<button class="${S.tab===x[0]?"on":""}" onclick="setTab('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`;window.XingyouCloud?.mount()}
render();
</script>
<script>
(() => {
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  document.documentElement.classList.toggle("ios-standalone", standalone);
  const installButton = document.getElementById("install-app");
  const updateButton = document.getElementById("update-app");
  const offlineNote = document.getElementById("offline-note");
  let deferredInstall = null;
  let swRegistration = null;
  let refreshing = false;
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredInstall = event;
    installButton.hidden = false;
  });
  installButton.addEventListener("click", async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    installButton.hidden = true;
  });
  window.addEventListener("appinstalled", () => {
    deferredInstall = null;
    installButton.hidden = true;
  });
  const showUpdate = registration => {
    swRegistration = registration;
    updateButton.hidden = false;
  };
  updateButton.addEventListener("click", () => {
    const waiting = swRegistration?.waiting;
    if (!waiting) return;
    updateButton.disabled = true;
    updateButton.textContent = "正在更新…";
    waiting.postMessage({type: "SKIP_WAITING"});
  });
  const updateOfflineState = () => { offlineNote.hidden = navigator.onLine; };
  window.addEventListener("online", updateOfflineState);
  window.addEventListener("offline", updateOfflineState);
  updateOfflineState();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).then(registration => {
      swRegistration = registration;
      if (registration.waiting) showUpdate(registration);
      registration.addEventListener("updatefound", () => {
        const installing = registration.installing;
        if (!installing) return;
        installing.addEventListener("statechange", () => {
          if (installing.state === "installed" && navigator.serviceWorker.controller) showUpdate(registration);
        });
      });
    }).catch(() => {});
  }
})();
</script>
